name: Feature Request & RFC
description: Propose a new feature, extension capability, or architectural enhancement
title: "[RFC]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a feature! Review [CONTRIBUTING.md](CONTRIBUTING.md) to understand LUMI's core philosophy (minimal core, extensible via extensions).
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem or limitation does this feature address?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution, API design, or architecture.
    validations:
      required: true
